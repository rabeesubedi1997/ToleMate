<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>ToleMate</title>
    <!-- Google Translate widget -->
    <style>
      /* Hide the Google Translate top banner/toolbar */
      .goog-te-banner-frame, .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0 !important; }
      /* Style the inline select to match our design */
      #google_translate_element .goog-te-gadget-simple {
        background: transparent !important;
        border: 1px solid #e5e7eb !important;
        border-radius: 6px !important;
        padding: 4px 8px !important;
        font-size: 13px !important;
        cursor: pointer !important;
      }
      #google_translate_element .goog-te-gadget-simple .goog-te-menu-value {
        color: #4b5563 !important;
      }
      #google_translate_element .goog-te-gadget-simple .goog-te-menu-value span { color: #4b5563 !important; }
      #google_translate_element .goog-te-gadget-simple img { display: none !important; }
      #google_translate_element .goog-te-gadget { font-size: 0 !important; }
      #google_translate_element .goog-te-gadget > span { display: none !important; }
      /* Mobile translate element */
      #google_translate_element_mobile .goog-te-gadget-simple {
        background: transparent !important;
        border: 1px solid #e5e7eb !important;
        border-radius: 6px !important;
        padding: 3px 6px !important;
        font-size: 12px !important;
        cursor: pointer !important;
      }
      #google_translate_element_mobile .goog-te-gadget-simple .goog-te-menu-value { color: #4b5563 !important; }
      #google_translate_element_mobile .goog-te-gadget-simple .goog-te-menu-value span { color: #4b5563 !important; }
      #google_translate_element_mobile .goog-te-gadget-simple img { display: none !important; }
      #google_translate_element_mobile .goog-te-gadget { font-size: 0 !important; }
      #google_translate_element_mobile .goog-te-gadget > span { display: none !important; }
    </style>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        var opts = { pageLanguage: 'en', autoDisplay: false };
        new google.translate.TranslateElement(opts, 'google_translate_element');
        new google.translate.TranslateElement(opts, 'google_translate_element_mobile');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
